[package]
name = "y-editor"
version = "0.0.4"
description = "A local-first Markdown editor"
authors = ["y-editor contributors"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "y_editor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
rusqlite = { version = "0.37", features = ["bundled"] }
tauri = { version = "=2.11.5", features = ["macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53.1", features = ["process", "io-util", "time", "sync", "macros"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
thiserror = "2.0.20"
tempfile = "3.27.0"
sha2 = "0.11.0"
base64 = "0.23.1"
notify = "8.2.0"
ignore = "0.4.33"
trash = "5.2.9"
tauri-plugin-dialog = "2.7.3"
tauri-plugin-opener = "2.5.5"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

